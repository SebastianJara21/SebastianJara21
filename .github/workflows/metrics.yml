name: Metrics

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC (01:00 en Ecuador)
  workflow_dispatch:      # también se puede lanzar a mano desde la pestaña Actions
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: SebastianJara21
          filename: assets/github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Guayaquil
          config_display: large
